<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <img src="./images/registration form.jpg" alt=""><hr>
        <form action="">
            <input class="inp" type="text" placeholder="نام خود را وارد کنید">
            <input class="inp" type="email" placeholder="ایمیل خود را وراد کنید">
            <input class="inp" type="password" placeholder="رمز عبور خود را وارد کنید">
            <input class="submit" type="submit" value="ثبت نام">
        </form>
        <p>برای ثبت نام در سایت از طریق فرم اقدام کنید</p>
    </div>
</body>
</html>
